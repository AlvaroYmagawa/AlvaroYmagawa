<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Kenzo Ymagawa. Full-stack and AI engineer, Tech Lead at CodeLeap, based in Paraná, Brazil."><style>.fade{animation:on .8s ease both}@keyframes on{from{opacity:0}to{opacity:1}}.glow{animation:glow 6s ease-in-out infinite alternate}@keyframes glow{from{opacity:.4}to{opacity:.85}}.ping{transform-box:fill-box;transform-origin:center;animation:pg 2.4s ease-out infinite}@keyframes pg{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><radialGradient id="g" cx="0.5" cy="0" r="0.75"><stop offset="0" stop-color="#5360d9" stop-opacity=".6"/><stop offset="1" stop-color="#5360d9" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1200" height="440" rx="18" fill="#0d0e1a"/><rect width="1200" height="440" rx="18" fill="url(#dots)"/><rect class="glow" width="1200" height="440" rx="18" fill="url(#g)"/><text x="600.0" y="76" text-anchor="middle" fill="#798bf2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" letter-spacing="4" class="fade">TECH LEAD · CODELEAP</text><text x="600.0" y="170" text-anchor="middle" fill="#f2f4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2" class="fade" style="animation-delay:.15s">Kenzo Ymagawa<tspan fill="#798bf2">.</tspan></text><text x="600.0" y="228" text-anchor="middle" fill="#c6cfff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" class="fade" style="animation-delay:.35s">Full-stack &amp; AI engineer. I build mobile and web products,</text><text x="600.0" y="270" text-anchor="middle" fill="#c6cfff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" class="fade" style="animation-delay:.4s">and the AI workflows CodeLeap uses to ship them.</text><g class="fade" style="animation-delay:.6s" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#f2f4ff"><rect x="260.4" y="302" width="94.0" height="40" rx="20" fill="none" stroke="#5360d9" stroke-width="2"/><text x="307.4" y="329" text-anchor="middle">REACT</text><rect x="366.4" y="302" width="180.8" height="40" rx="20" fill="none" stroke="#5360d9" stroke-width="2"/><text x="456.8" y="329" text-anchor="middle">REACT NATIVE</text><rect x="559.2" y="302" width="106.4" height="40" rx="20" fill="none" stroke="#5360d9" stroke-width="2"/><text x="612.4" y="329" text-anchor="middle">DJANGO</text><rect x="677.6" y="302" width="69.2" height="40" rx="20" fill="none" stroke="#5360d9" stroke-width="2"/><text x="712.2" y="329" text-anchor="middle">AWS</text><rect x="758.8" y="302" width="180.8" height="40" rx="20" fill="none" stroke="#34d39e" stroke-width="2"/><text x="849.2" y="329" text-anchor="middle">AI WORKFLOWS</text></g><g class="fade" style="animation-delay:.8s"><circle class="ping" cx="488.0" cy="391" r="9" fill="none" stroke="#1fb25a" stroke-width="2.5"/><circle cx="488.0" cy="391" r="9" fill="#1fb25a" stroke="#ffd23f" stroke-width="3"/><text x="510.0" y="402" fill="#f2f4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800">Paraná, Brazil</text></g></svg>